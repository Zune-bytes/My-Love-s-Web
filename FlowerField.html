<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Lyel's Field of Flower :)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2=family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #fff0f3 0%, #ffe3e8 40%, #fbc4ce 100%);
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            position: relative;
            cursor: crosshair;
            opacity: 0;
            animation: fadeInPage 1.5s ease-in-out forwards;
        }

        @keyframes fadeInPage {
            to { opacity: 1; }
        }

        .field-header {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
            max-width: 700px;
            pointer-events: none;
            z-index: 10;
        }

        .field-header h1 {
            font-family: 'Great Vibes', cursive, sans-serif;
            font-size: 56px;
            color: #ff6f91;
            text-shadow: 0 4px 12px rgba(255, 111, 145, 0.2);
            margin-bottom: 10px;
        }

        .field-header p {
            font-size: 15px;
            color: #8c6b70;
            font-style: italic;
            letter-spacing: 0.5px;
        }

        .interactive-flower {
            position: absolute;
            pointer-events: none;
            user-select: none;
            z-index: 5;
            animation: growAndFloat 4s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
            transform-origin: center bottom;
        }

        @keyframes growAndFloat {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 0;
            }
            15% {
                transform: translate(-50%, -50%) scale(1.2) rotate(15deg);
                opacity: 0.9;
            }
            30% {
                transform: translate(-50%, -50%) scale(1) rotate(-10deg);
                opacity: 1;
            }
            100% {
                transform: translate(calc(-50% + var(--drift-x)), calc(-50% - 250px)) scale(0.7) rotate(var(--final-rot));
                opacity: 0;
            }
        }

        .heart-flower {
            position: absolute;
            pointer-events: none;
            user-select: none;
            z-index: 6;
            animation: spawnHeartFlower 5s ease-out forwards;
        }

        @keyframes spawnHeartFlower {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                transform: translate(-50%, -50%) scale(1.3) rotate(20deg);
                opacity: 1;
            }
            20% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
            75% {
                opacity: 1;
            }
            100% {
                transform: translate(-50%, calc(-50% - 80px)) scale(0.5) rotate(45deg);
                opacity: 0;
            }
        }

        .controls-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 20;
            width: 100%;
            max-width: 400px;
        }

        .heart-trigger-btn {
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 15px;
            color: #ffffff;
            background: linear-gradient(45deg, #ff6f91, #ff92ae);
            border: none;
            padding: 14px 32px;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 111, 145, 0.3);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .heart-trigger-btn:hover {
            transform: scale(1.06) translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 111, 145, 0.45);
        }

        .heart-trigger-btn:active {
            transform: scale(0.98) translateY(0);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid #ffccd5;
            padding: 8px 20px;
            border-radius: 30px;
            color: #ff6f91;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(255, 111, 145, 0.1);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <audio id="field-music" src="Chill.mp3" loop></audio>

    <div class="field-header">
        <h1>Enjoy ur day bebi :></h1>
        <p>u tap tap eniwer or move ur mouse around if ure using pc bebi hehe </p>
    </div>

    <div class="controls-container">
        <button id="heart-magic-btn" class="heart-trigger-btn">
            u click to make a heart of flowers hihi :p
        </button>
        <a href="index.html" class="back-btn">✨ if u still want to read, click this bebi :)</a>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const flowersPool = ["🌸", "🌷", "💮", "🌺", "🌼", "🪷", "🌻", "💐", "✨", "🎀", "💖", "😽", "😻"];
            let lastSpawnTime = 0;
            let musicStarted = false;

            const bgMusic = document.getElementById("field-music");
            const heartBtn = document.getElementById("heart-magic-btn");

            const spawnFlower = (x, y) => {
                const now = Date.now();
                if (now - lastSpawnTime < 45) return; 
                lastSpawnTime = now;

                const flower = document.createElement("div");
                flower.classList.add("interactive-flower");
                
                flower.innerText = flowersPool[Math.floor(Math.random() * flowersPool.length)];
                flower.style.left = x + "px";
                flower.style.top = y + "px";
                flower.style.fontSize = Math.random() * 25 + 20 + "px"; 

                const randomDriftX = (Math.random() * 140 - 70) + "px";
                const randomRotation = (Math.random() * 360 - 180) + "deg";
                flower.style.setProperty('--drift-x', randomDriftX);
                flower.style.setProperty('--final-rot', randomRotation);

                document.body.appendChild(flower);

                setTimeout(() => { flower.remove(); }, 4000);
            };

            window.addEventListener("mousemove", (e) => {
                spawnFlower(e.clientX, e.clientY);
            });

            window.addEventListener("touchmove", (e) => {
                if (e.touches.length > 0) {
                    spawnFlower(e.touches[0].clientX, e.touches[0].clientY);
                }
            });

            const makeHeartOfFlowers = () => {
                
                if (bgMusic && !musicStarted) {
                    bgMusic.play().then(() => {
                        musicStarted = true;
                        console.log("Romantic track playing flawlessly... 🎵");
                    }).catch(err => console.log("Audio waiting for stronger permissions:", err));
                }

                const centerX = window.innerWidth / 2;
                const centerY = window.innerHeight * 0.45; 
                
                
                const scale = window.innerWidth < 600 ? 10 : 16; 
                const steps = window.innerWidth < 600 ? 40 : 60; 

                console.log("Assembling geometric heart pattern... 🌸🩷");

                for (let i = 0; i < steps; i++) {
                    setTimeout(() => {
                        
                        const angle = (i / steps) * Math.PI * 2;
                        
                        
                        const xOffset = 16 * Math.pow(Math.sin(angle), 3);
                        const yOffset = 13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle);
                        
                        
                        const targetX = centerX + (xOffset * scale);
                        const targetY = centerY - (yOffset * scale); 

                        
                        const petal = document.createElement("div");
                        petal.classList.add("heart-flower");
                        
                        petal.innerText = flowersPool[Math.floor(Math.random() * flowersPool.length)];
                        petal.style.left = targetX + "px";
                        petal.style.top = targetY + "px";
                        petal.style.fontSize = Math.random() * 16 + 24 + "px"; 

                        document.body.appendChild(petal);

                        
                        setTimeout(() => { petal.remove(); }, 5000);
                    }, i * 35);
                }
            };

            if (heartBtn) {
                heartBtn.addEventListener("click", makeHeartOfFlowers);
            }
        });
    </script>
</body>
</html>
